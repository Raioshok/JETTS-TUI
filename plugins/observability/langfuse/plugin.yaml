name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for JettsTUI — traces conversations, LLM calls, and tool usage. Opt-in via `jettstui plugins enable observability/langfuse` or `jettstui tools → Langfuse Observability`."
author: jettstui
requires_env:
  - JETTSTUI_LANGFUSE_PUBLIC_KEY
  - JETTSTUI_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
