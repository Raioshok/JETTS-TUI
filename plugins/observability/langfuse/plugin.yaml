name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for FreeIDE — traces conversations, LLM calls, and tool usage. Opt-in via `freeide plugins enable observability/langfuse` or `freeide tools → Langfuse Observability`."
author: freeide
requires_env:
  - FREEIDE_LANGFUSE_PUBLIC_KEY
  - FREEIDE_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
