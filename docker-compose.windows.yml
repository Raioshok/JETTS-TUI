#
# docker-compose.windows.yml — Windows Docker Desktop compatible
#
# Differences from docker-compose.yml:
#   - Removes `network_mode: host` (not supported on Docker Desktop for Windows)
#   - Uses explicit port mappings instead
#   - Uses the native Jetts-TUI data directory under LOCALAPPDATA
#
# Usage:
#   docker compose -f docker-compose.windows.yml up -d
#
services:
  gateway:
    build: .
    image: jetts-tui:local
    container_name: jetts-tui
    restart: unless-stopped
    volumes:
      - ${LOCALAPPDATA}/jettstui:/opt/data
    environment:
      - FREEIDE_UID=10000
      - FREEIDE_GID=10000
    command: ["gateway", "run"]

  dashboard:
    image: jetts-tui:local
    container_name: jetts-tui-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${LOCALAPPDATA}/jettstui:/opt/data
    environment:
      - FREEIDE_UID=10000
      - FREEIDE_GID=10000
      - FREEIDE_DASHBOARD_HOST=0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]
